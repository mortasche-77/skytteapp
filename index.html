<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyttedagbok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">
    
    <!-- Navigationsbar -->
    <nav class="bg-slate-800 border-b border-slate-700 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 flex justify-around items-center h-16">
            <button onclick="showTab('dashboard')" id="btn-dashboard" class="flex flex-col items-center text-xs font-medium text-blue-400">
                <span class="text-lg">📊</span> Översikt
            </button>
            <button onclick="showTab('map')" id="btn-map" class="flex flex-col items-center text-xs font-medium text-slate-400 hover:text-slate-200">
                <span class="text-lg">🎯</span> Träffkarta
            </button>
        </div>
    </nav>

    <!-- Huvudinnehåll -->
    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Laddningsindikator -->
        <div id="loading" class="text-center py-20 text-slate-400">
            Laddar in skjutdata från molnet...
        </div>

        <!-- Dashboard / Översikt -->
        <div id="tab-dashboard" class="space-y-6 hidden">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-sm">
                    <p class="text-xs text-slate-400 font-medium">Antal pass</p>
                    <p id="kpi-total-pass" class="text-3xl font-extrabold text-blue-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-sm">
                    <p class="text-xs text-slate-400 font-medium">Högsta resultat</p>
                    <p id="kpi-max-score" class="text-3xl font-extrabold text-emerald-400 mt-1">-</p>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-sm">
                <h2 class="text-sm font-bold text-slate-200 mb-3">Poängutveckling</h2>
                <div class="relative h-60">
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Träffkarta -->
        <div id="tab-map" class="space-y-6 hidden">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-sm space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-bold text-slate-200">Träffbild & Tavla</h2>
                    <span id="shot-count-badge" class="text-xs bg-blue-900 text-blue-300 px-2.5 py-1 rounded-full font-medium">0 skott</span>
                </div>

                <!-- Pass-väljare -->
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 max-h-40 overflow-y-auto space-y-2" id="pass-checkboxes">
                    <p class="text-xs text-slate-400">Laddar pass...</p>
                </div>

                <!-- Kvadratisk behållare för tavlan -->
                <div class="relative w-full aspect-square bg-slate-950 rounded-xl border border-slate-700 flex justify-center items-center overflow-hidden p-2">
                    <canvas id="hitMapChart"></canvas>
                </div>
                <p class="text-xs text-slate-400 text-center">Ciklarna motsvarar tavelringar (10, 9, 8, 7 i mm).</p>
            </div>
        </div>

    </main>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyXHpsd0Gpz8hyi17k8kgjV_y0H_ntXkidL5IBtCIt3LOZtFnxobLmKDJMLSXU8Ol7m/exec';

        let shootingData = [];
        let scoreChart = null;
        let hitMapChart = null;

        const palette = [
            'rgba(239, 68, 68, 0.9)',   // Röd
            'rgba(59, 130, 246, 0.9)',  // Blå
            'rgba(16, 185, 129, 0.9)',  // Grön
            'rgba(245, 158, 11, 0.9)',  // Orange
            'rgba(168, 85, 247, 0.9)',  // Lila
            'rgba(236, 72, 153, 0.9)'   // Rosa
        ];

        // Chart.js Plugin för att rita ut tavelringar som bakgrund
        const targetBackgroundPlugin = {
            id: 'targetBackground',
            beforeDraw(chart) {
                const { ctx, chartArea: { left, right, top, bottom, width, height }, scales: { x, y } } = chart;
                ctx.save();
                
                // Exempel för 10m luftpistol (ungefärliga tavelringar i mm: 10-ring = 11.5mm, 9-ring = 27.5mm, osv, anpassat till skalan -30 till 30)
                // Vi ritar cirklar baserat på millimeterradier
                const rings = [
                    { radiusMm: 5.0, color: 'rgba(255, 255, 255, 0.15)', label: '10' },
                    { radiusMm: 12.5, color: 'rgba(255, 255, 255, 0.1)', label: '9' },
                    { radiusMm: 20.0, color: 'rgba(255, 255, 255, 0.07)', label: '8' },
                    { radiusMm: 27.5, color: 'rgba(255, 255, 255, 0.05)', label: '7' }
                ];

                rings.forEach(ring => {
                    const centerX = x.getPixelForValue(0);
                    const centerY = y.getPixelForValue(0);
                    const radiusX = (x.getPixelForValue(ring.radiusMm) - centerX);

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, Math.abs(radiusX), 0, 2 * Math.PI);
                    ctx.fillStyle = ring.color;
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.stroke();
                });

                // Rita hårkors i mitten
                const cx = x.getPixelForValue(0);
                const cy = y.getPixelForValue(0);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(cx, top); ctx.lineTo(cx, bottom);
                ctx.moveTo(left, cy); ctx.lineTo(right, cy);
                ctx.stroke();

                ctx.restore();
            }
        };

        function showTab(tab) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-map').classList.add('hidden');
            document.getElementById('btn-dashboard').className = "flex flex-col items-center text-xs font-medium text-slate-400";
            document.getElementById('btn-map').className = "flex flex-col items-center text-xs font-medium text-slate-400";

            if (tab === 'dashboard') {
                document.getElementById('tab-dashboard').classList.remove('hidden');
                document.getElementById('btn-dashboard').className = "flex flex-col items-center text-xs font-medium text-blue-400";
            } else {
                document.getElementById('tab-map').classList.remove('hidden');
                document.getElementById('btn-map').className = "flex flex-col items-center text-xs font-medium text-blue-400";
            }
        }

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                shootingData = await response.json();
                
                document.getElementById('loading').classList.add('hidden');
                showTab('dashboard');
                
                updateKPIs();
                renderScoreChart();
                initPassCheckboxes();
                renderHitMap();
            } catch (err) {
                document.getElementById('loading').innerText = 'Kunde inte ladda data. Kontrollera nätverket.';
            }
        }

        function updateKPIs() {
            const uniquePasses = [...new Set(shootingData.map(d => d.Filnamn))].filter(Boolean);
            document.getElementById('kpi-total-pass').innerText = uniquePasses.length || shootingData.length;
            
            const scores = shootingData.map(d => parseFloat(d.Total) || 0).filter(s => s > 0);
            const maxScore = scores.length > 0 ? Math.max(...scores) : '-';
            document.getElementById('kpi-max-score').innerText = maxScore;
        }

        function renderScoreChart() {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            const passMap = {};
            shootingData.forEach(d => {
                if(d.Filnamn && d.Total) {
                    passMap[d.Filnamn] = { datum: d.Datum, total: parseFloat(d.Total) };
                }
            });
            const passes = Object.values(passMap);

            scoreChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: passes.map(p => p.datum),
                    datasets: [{
                        label: 'Totalpoäng',
                        data: passes.map(p => p.total),
                        borderColor: '#60a5fa',
                        backgroundColor: 'rgba(96, 165, 250, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2,
                        pointRadius: 4,
                        pointBackgroundColor: '#60a5fa'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
                    }
                }
            });
        }

        function initPassCheckboxes() {
            const container = document.getElementById('pass-checkboxes');
            container.innerHTML = '';

            shootingData.forEach((pass, index) => {
                if (!pass.Filnamn) return;

                const label = document.createElement('label');
                label.className = "flex items-center space-x-2 text-xs text-slate-300 cursor-pointer hover:text-white";
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = index;
                if (index === 0) checkbox.checked = true;
                checkbox.className = "rounded bg-slate-800 border-slate-600 text-blue-500 focus:ring-blue-500";
                checkbox.addEventListener('change', renderHitMap);

                const colorIndicator = document.createElement('span');
                colorIndicator.className = "w-2.5 h-2.5 rounded-full inline-block";
                colorIndicator.style.backgroundColor = palette[index % palette.length];

                const textSpan = document.createElement('span');
                textSpan.innerText = `${pass.Datum || 'Datum saknas'} (${pass.Total || '0'}p)`;

                label.appendChild(checkbox);
                label.appendChild(colorIndicator);
                label.appendChild(textSpan);
                container.appendChild(label);
            });
        }

        function renderHitMap() {
            const ctx = document.getElementById('hitMapChart').getContext('2d');
            const checkboxes = document.querySelectorAll('#pass-checkboxes input[type="checkbox"]');
            
            let datasets = [];
            let totalShotsCount = 0;

            checkboxes.forEach((cb, colorIdx) => {
                if (cb.checked) {
                    const passIndex = parseInt(cb.value);
                    const pass = shootingData[passIndex];
                    
                    if (pass && pass.shots && pass.shots.length > 0) {
                        totalShotsCount += pass.shots.length;
                        datasets.push({
                            label: pass.Filnamn,
                            data: pass.shots.map(s => ({ x: s.x, y: s.y })),
                            backgroundColor: palette[colorIdx % palette.length],
                            pointRadius: 6,
                            pointHoverRadius: 8
                        });
                    }
                }
            });

            document.getElementById('shot-count-badge').innerText = `${totalShotsCount} skott`;

            if (hitMapChart) {
                hitMapChart.destroy();
            }

            hitMapChart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: true, // Tvingar perfekt kvadratisk proportion
                    aspectRatio: 1,            // 1:1 proportion
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { 
                            min: -32, max: 32, 
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }, 
                            ticks: { color: '#94a3b8', font: { size: 9 } } 
                        },
                        y: { 
                            min: -32, max: 32, 
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }, 
                            ticks: { color: '#94a3b8', font: { size: 9 } } 
                        }
                    }
                },
                plugins: [targetBackgroundPlugin]
            });
        }

        loadData();
    </script>
</body>
</html>
